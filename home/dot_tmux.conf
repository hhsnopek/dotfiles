# Keep sessions running when the last client goes away (quitting Ghostty,
# closing a tab, a dropped ttyd connection) so they can be reattached with
# `tmux a`. Both are tmux's defaults; pinned so a future config cannot flip
# them without it being visible here.
set -g destroy-unattached off
set -g exit-unattached off

set -g default-terminal tmux-256color
set -as terminal-features ",*:RGB"
set-environment -g COLORTERM truecolor
set -g extended-keys on
set -g extended-keys-format csi-u
set -g history-limit 50000
set -g mouse off

# Machine-only settings, such as a tmux 3.8 `theme` or a non-default shell.
source-file -q ~/.tmux.local.conf
